<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#b2c7d9">
  <title>점메추리알 · 카카오톡 대화 시연</title>
  <link rel="stylesheet" href="/demo.css?v=20261117-2">
</head>
<body>
  <main class="layout">
    <section class="guide">
      <a class="back" href="/">← 점메추리알 홈</a>
      <div class="brand">🥚 점메추리알 <span>대화 시연</span></div>
      <h1>단톡방에서는<br>이렇게 사용해요</h1>
      <p>회사 주소와 식사 시간을 먼저 등록한 뒤 예시 메뉴를 넣어보세요. 시계를 10시 45분으로 넘기면 룰렛, 당첨 캐릭터, 회사 주변 식당을 볼 수 있어요.</p>
      <div class="notice">시연용 가상 대화입니다. 실제 카카오톡 메시지가 전송되거나 저장되지는 않아요.</div>
      <div class="steps"><span>① 회사·식사 시간 설정</span><span>② 메뉴 익명 입력</span><span>③ 10:45 룰렛</span><span>④ 주변 식당 추천</span></div>
    </section>
    <section class="phone" aria-label="카카오톡 단체방 시연">
      <div class="phone-top"><span>9:41</span><span>●●● ▰</span></div>
      <header class="chat-head"><button id="backBtn" aria-label="처음부터">〈</button><div><strong>우리 팀 점심방</strong><small>참여자 5명 · 시연용</small></div><button id="resetBtn" title="시연 다시 시작">↻</button></header>
      <div class="chat-tools"><span id="clockLabel">오전 10:30 · 메뉴 모집 중</span><button id="advanceBtn">10:45로 이동 →</button></div>
      <div id="messages" class="messages" role="log" aria-live="polite"></div>
      <div class="composer"><button id="plusBtn" title="메뉴 예시">＋</button><input id="chatInput" maxlength="80" placeholder="먹고 싶은 메뉴를 입력하세요" aria-label="메뉴 또는 명령어"><button id="sendBtn">전송</button></div>
      <div class="quick-actions"><button id="settingsQuick">회사 설정</button><button id="sampleBtn">예시 메뉴 3개 넣기</button><button data-menu="김치찌개">김치찌개</button><button data-menu="돈까스">돈까스</button><button data-menu="초밥">초밥</button><button id="spinQuick">#룰렛돌리기</button></div>
    </section>
  </main>
  <script src="/demo.js?v=20261118-2"></script>
</body>
</html>
