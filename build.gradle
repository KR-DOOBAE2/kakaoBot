plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}
allprojects { group = 'kr.jeommechurial'; version = '0.1.0'; repositories { mavenCentral() } }
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    dependencyManagement { imports { mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES } }
    tasks.withType(JavaCompile).configureEach { options.compilerArgs.add('-parameters') }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    dependencies { testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
}



