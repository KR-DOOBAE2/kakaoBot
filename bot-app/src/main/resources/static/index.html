<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8e8"><title>점메추리알 🥚</title><link rel="stylesheet" href="/style.css"></head><body>
<main class="shell"><header><div class="egg">🥚</div><div><span class="eyebrow">오늘 점심, 부화합니다</span><h1>점메추리알</h1><p class="sub">메뉴 고민은 알이 맡을게요 🐣</p></div></header>
<section id="create" class="card create"><div class="section-title"><span>새 점심방 만들기</span><span class="badge">5초면 끝!</span></div><label>대화방 이름<input id="room" maxlength="80" placeholder="예: 우리 팀 점심팟"></label><label>오늘의 모집 이름<input id="title" maxlength="80" value="오늘 점심 메뉴 모집"></label><button class="primary" id="createBtn">🥚 알 깨우기 · 방 만들기</button><p class="hint">만든 뒤 참여 링크를 카카오톡 단체방에 공유하면 돼요.</p></section>
<section id="roomView" class="hidden"><div class="card hero"><div class="roomtop"><span class="badge" id="status">모집 중</span><button class="share" id="shareBtn">카카오톡에 공유 ↗</button></div><h2 id="roundTitle"></h2><p id="roomName" class="sub"></p><div id="winner" class="winner hidden"></div></div>
<div class="card"><div class="section-title"><span>🍽️ 먹고 싶은 메뉴</span><span id="count" class="count"></span></div><form id="menuForm"><label>내 이름<input id="name" maxlength="40" placeholder="예: 점심요정" required></label><label>메뉴<input id="menu" maxlength="80" placeholder="예: 김치찌개" required></label><button class="primary" type="submit">메뉴 등록하기</button></form><button class="text-button" id="cancelBtn">내 메뉴 등록 취소</button><div id="entries" class="entries"></div></div>
<div id="admin" class="card hidden"><div class="section-title"><span>🎲 방장 메뉴</span><span class="badge">방장만 보여요</span></div><div class="adminbuttons"><button class="primary" id="drawBtn">알이 뽑아볼게!</button><button class="secondary" id="rerollBtn">다시 뽑기</button><button class="secondary" id="closeBtn">모집 마감</button></div></div></section><footer>일반 카카오톡 메시지는 읽지 않아요 · 링크에서 안전하게 참여해요</footer></main><div id="toast" role="status"></div><script src="/app.js"></script></body></html>
