<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8e8"><title>점메추리알 🥚</title><link rel="stylesheet" href="/style.css"></head><body>
<main class="shell"><header><div class="egg">🥚</div><div><span class="eyebrow">오늘 점심, 부화합니다</span><h1>점메추리알</h1><p class="sub">메뉴 고민은 알이 맡을게요 🐣</p></div></header>
<a class="demo-link" href="/demo.html">💬 카카오톡처럼 사용해보기 →</a><section id="create" class="card create"><div class="section-title"><span>새 점심방 만들기</span><span class="badge">익명 메뉴 모집</span></div><label>대화방 이름<input id="room" maxlength="80" placeholder="예: 우리 팀 점심팟"></label><label>오늘의 모집 이름<input id="title" maxlength="80" value="오늘 점심 메뉴 모집"></label><button class="primary" id="createBtn">🥚 알 깨우기 · 방 만들기</button><p class="hint">참여 링크를 카카오톡 단체방에 공유하세요. 메뉴는 오전 10시 44분까지 받고 10시 45분에 결과가 나와요.</p></section>
<section id="roomView" class="hidden"><div class="card hero"><div class="roomtop"><span class="badge" id="status">모집 중</span><button class="share" id="shareBtn">카카오톡에 공유 ↗</button></div><h2 id="roundTitle"></h2><p id="roomName" class="sub"></p><p id="schedule" class="schedule"></p><div id="winner" class="winner hidden"></div></div>
<div class="card"><div class="section-title"><span>🍽️ 익명으로 먹고 싶은 메뉴</span><span id="count" class="count"></span></div><form id="menuForm"><label>메뉴<input id="menu" maxlength="80" placeholder="예: 김치찌개" required></label><button class="primary" type="submit">익명으로 메뉴 등록</button></form><button class="text-button" id="cancelBtn">내 메뉴 등록 취소</button><div id="entries" class="entries"></div></div>
<div class="card"><div class="section-title"><span>🎲 두구두구 룰렛</span><span class="badge">결과는 한 번만 선정</span></div><p id="countdown" class="countdown"></p><button class="primary" id="spinBtn" disabled>#룰렛돌리기</button><p class="hint">오전 10시 45분이 되면 모두 같은 결과를 볼 수 있어요.</p></div></section><footer>메뉴를 정한 사람의 이름은 표시하지 않아요 · 카카오톡에는 링크를 공유해요</footer></main><div id="toast" role="status"></div><script src="/app.js"></script></body></html>
