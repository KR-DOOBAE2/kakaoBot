name: Keep Render demo awake

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check application health
        run: curl --fail --silent --show-error --location --retry 2 --retry-delay 5 --max-time 90 https://kakaobot-nkrp.onrender.com/actuator/health

